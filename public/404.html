<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Receitas Culinárias</title>
    <!--
      Técnica padrão de fallback de SPA para o GitHub Pages (Project Pages).
      Como o GitHub Pages não suporta rewrite de rotas no servidor, qualquer
      recarregamento em uma rota profunda (ex: /receitas-culinarias/receitas/5)
      cai neste 404.html, que redireciona de volta para o index.html codificando
      o caminho original na querystring. O script em index.html decodifica e
      restaura a URL antes do React Router assumir o controle.
    -->
    <script>
      var pathSegmentsToKeep = 1; // mantém "/receitas-culinarias" como base do Project Page
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
